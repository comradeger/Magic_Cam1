name: Android CI/CD with RTMP Support

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.2.2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;25.1.8937393"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace --info

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: virtual-camera-manager-rtmp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build release APK
        if: github.ref == 'refs/heads/main'
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: virtual-camera-manager-rtmp-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

  security-scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan
        uses: securecodewarrior/github-action-add-sarif@v1
        with:
          sarif-file: 'security-scan-results.sarif'
        continue-on-error: true

  release:
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: virtual-camera-manager-rtmp-release
          path: ./release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ./release/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Virtual Camera Manager with RTMP Support

            ### Features
            - ✅ Root-based virtual camera management
            - ✅ V4L2 loopback device integration
            - ✅ Camera HAL interface support
            - ✅ RTMP stream input support
            - ✅ Multiple video source options
            - ✅ Real-time frame streaming
            - ✅ Professional Material Design UI

            ### Requirements
            - Rooted Android device (Android 7.0+)
            - V4L2 kernel support
            - Network access for RTMP streams

            ### Installation
            1. Download the APK
            2. Enable "Unknown Sources" in Android settings
            3. Install the APK
            4. Grant root permissions when prompted
            5. Configure your virtual camera settings

            ### RTMP Usage
            - Enter your RTMP stream URL
            - Start the RTMP service
            - Start the virtual camera with the RTMP source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
